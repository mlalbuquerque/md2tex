# Configuração inicial do md2tex.
# Todos os valores de estilo e compilação usados pelo md2tex devem estar aqui.

document_class: article

class_options:
  - a4paper

style_packages:
  - fontspec
  - longtable
  - booktabs
  - array
  - calc
  - graphicx
  - adjustbox
  - float
  - pdflscape
  - xcolor
  - ulem
  - soul
  - enumitem
  - ragged2e
  - amssymb
  - tcolorbox
  - etoolbox
  - hyperref
  - xurl
  - listings
  - svg

page_geometry:
  top: 2.5cm
  bottom: 2.5cm
  left: 3cm
  right: 3cm

typography:
  language: brazil
  fontsize: 11pt
  mainfont: Latin Modern Roman
  line_spacing: '1.0'

preamble_includes:
  - '\PassOptionsToPackage{normalem}{ulem}'
  - '\tcbuselibrary{breakable}'
  - '\robustify\url'
  - '\robustify\path'
  - '\pdfstringdefDisableCommands{\def\url#1{\passthrough{\detokenize{#1}}}\def\path#1{\passthrough{\detokenize{#1}}}}'
  - '\lstset{basicstyle=\ttfamily\small,breaklines=true,breakatwhitespace=false,columns=fullflexible,keepspaces=true,showstringspaces=false,upquote=true}'
  - '\Urlmuskip=0mu plus 1mu'
  - '\setlength{\emergencystretch}{3em}'
  - '\providecommand{\passthrough}[1]{#1}'
  - '\providecommand{\hl}[1]{#1}'
  - '\providecommand{\tightlist}{\setlength{\itemsep}{0pt}\setlength{\parskip}{0pt}}'
  - '\providecommand{\mdtexTableOfContents}{\tableofcontents\clearpage}'
  - '\providecommand{\mdtexStartTable}{}'
  - '\providecommand{\mdtexEndTable}{}'
  - '\providecommand{\mdtexDivider}{\par\noindent\rule{\linewidth}{0.4pt}\par}'
  - '\newtcolorbox{mdtexNote}{breakable,title=Observação,colback=gray!5,colframe=gray!55!black}'
  - '\newtcolorbox{mdtexWarning}{breakable,title=Atenção,colback=yellow!8,colframe=yellow!45!black}'
  - '\newtcolorbox{mdtexDecision}{breakable,title=Decisão,colback=blue!5,colframe=blue!55!black}'
  - '\hypersetup{colorlinks=true,linkcolor=black,urlcolor=blue}'

# Aparência e comportamento das tabelas.
tables:
  landscape: auto
  font: small
  width: auto
  borders: none
  zebra: false


compiler_options:
  engine: xelatex

